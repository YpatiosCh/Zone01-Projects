<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="/static/global.css" />
    <link rel="stylesheet" href="/static/breakpoints.css" />
    <link rel="stylesheet" href="/static/components.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!-- Navbar -->
      <nav class="navbar">
        <div class="navbar__container">
          <div class="navbar__logo">
            <a href="/">
              <img src="/static/files/logo.svg" alt="Logo" />
            </a>
          </div>
          <div class="navbar__actions">
            <a href="/login" class="btn">LOG IN</a>
          </div>
        </div>
      </nav>

      {{if .ValidationErr}}
      <div class="validation-error">{{.ValidationErr}}</div>
      {{end}}

      <!-- Signup Form Section -->
      <section class="signup-section">
        <div class="signup-container">
          <h1 class="signup-title">SIGN UP</h1>

          <form class="signup-form" method="POST" action="/signup">
            <div class="form-group">
              <label for="email">Type your email:</label>
              <input type="email" {{with .FormData}}value="{{index .
              "email"}}"{{end}} id="email" name="email" class="form-input"
              required>
            </div>

            <div class="form-group">
              <label for="username">Type your username:</label>
              <input type="text" {{with .FormData}}value="{{index .
              "username"}}"{{end}} id="username" name="username"
              class="form-input" required>
            </div>

            <div class="form-group">
              <label for="password">Type your password:</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                required
              />
            </div>

            <div class="form-group">
              <label for="confirm-password">Retype your password:</label>
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                class="form-input"
                required
              />
            </div>

            <p class="password-hint">
              The password must be minimum 8 characters
            </p>

            <button type="submit" class="btn">SIGN UP</button>
          </form>
        </div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer__content">
          <p>Powered by Zone01Athens</p>
        </div>
      </footer>
    </div>
  </body>
</html>
