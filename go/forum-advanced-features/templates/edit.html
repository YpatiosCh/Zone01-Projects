<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="/static/global.css" />
  <link rel="stylesheet" href="/static/components.css" />
  <link rel="stylesheet" href="/static/breakpoints.css" />
</head>

<body>
  <div class="page-wrapper">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar__container">
        <div class="navbar__logo">
          <a href="/">
            <img src="/static/files/logo.svg" alt="Logo" />
          </a>
        </div>
        <div class="navbar__actions">
          {{if .User}}
          <a href="/profile/{{.User.Username}}" class="btn">
            <span>PROFILE</span>
          </a>
          <form action="/logout" method="POST" style="display: inline">
            <button type="submit" class="btn">LOG OUT</button>
          </form>
          {{else}}
          <!-- Non-logged in user view -->
          <a href="/login" class="btn">LOG IN</a>
          <a href="/signup" class="btn">SIGN UP</a>
          {{end}}
        </div>
      </div>
    </nav>

    <!-- Create Post Section -->
    <section class="create-post-section">
      <div class="create-post-container">
        <h1 class="section-title">Edit Your Post</h1>

        {{if .ValidationErr}}
        <div class="validation-error">{{.ValidationErr}}</div>
        {{end}}

        <form class="create-post-form" method="POST" action="/posts/{{.Post.ID}}/edit" enctype="multipart/form-data">
          <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" class="form-input" placeholder="Enter your post title" required
              value="{{index .FormData "title"}}" />
          </div>

          <div class="form-group">
            <label>Categories:</label>
            <div class="categories-selection">
              {{range $category := .Categories}}
              <input type="checkbox" id="category-{{$category.ID}}" name="categories" value="{{$category.ID}}" style="display: none"
                {{range $.FormCategories}}{{if eq . $category.ID}}checked{{end}}{{end}} />
              <button type="button"
                class="category-btn {{range $.FormCategories}}{{if eq . $category.ID}}selected{{end}}{{end}}"
                data-category-id="{{$category.ID}}" onclick="toggleCategory(this)">
                {{$category.Name}}
              </button>
              {{end}}
            </div>
          </div>


          <div class="form-group">
            <label for="content">Content:</label>
            <textarea id="content" name="content" class="form-textarea" rows="10"
              placeholder="Write your post content here..." required>{{index .FormData "content"}}</textarea>
          </div>

          {{if .Post.HasImage}}
          <div class="form-group">
            <label>Current Image:</label>
            <div class="current-image-container">
              <img src="/{{.Post.Image}}" alt="Current post image" style="max-width: 300px; max-height: 200px;" />
            
            </div>
          </div>
          {{end}}

          <div class="form-group">
            <label for="image">{{if .Post.HasImage}}Replace with New Image:{{else}}Add a New Image:{{end}}</label>
            <!-- Hidden file input -->
            <input type="file" id="image" name="image" style="display: none;"
              accept="image/jpeg, image/jpg, image/png, image/gif" />
            <!-- Custom styled label button -->
            <label for="image" class="custom-file-button">
              Choose File
            </label>
            <!-- Display selected filename -->
            <span id="file-name" class="file-name-display">No file chosen</span>
            <p class="form-help-text">
              Supported formats: JPEG, JPG, PNG, GIF. Max Size 20MB.
            </p>
            <div class="remove-image-option">
              <input type="checkbox" id="remove_image" name="remove_image" />
              <label for="remove_image">Remove image</label>
            </div>
          </div>

          <div class="form-actions">
            <a href="/posts/{{.Post.ID}}" class="btn">CANCEL</a>
            <button type="submit" class="btn">SUBMIT</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__content">
        <p>Powered by Zone01Athens</p>
      </div>
    </footer>
  </div>
  <script src="/static/create-post.js"></script>
</body>

</html>
