<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/static/global.css">
  <link rel="stylesheet" href="/static/components.css">
  <link rel="stylesheet" href="/static/breakpoints.css">
  <script src="/static/create-post.js"></script>
</head>
<body>
  <div class="page-wrapper">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar__container">
        <div class="navbar__logo">
          <a href="/">
            <img src="/static/files/logo.svg" alt="Logo">
          </a>
        </div>
        <div class="navbar__actions">
          {{if .User}}
          <a href="/profile" class="navbar__username">Welcome, {{.User.Username}}</a>
          <a href="/profile" class="btn">
            <span>PROFILE</span> 
          </a>
          <form action="/logout" method="POST" style="display: inline;">
            <button type="submit" class="btn">LOG OUT</button>
          </form>
          {{else}}
          <!-- Non-logged in user view -->
          <a href="/login" class="btn">LOG IN</a>
          <a href="/signup" class="btn">SIGN UP</a>
          {{end}}
        </div>
      </div>
    </nav>

    <!-- Create Post Section -->
    <section class="create-post-section">
      <div class="create-post-container">
        <h1 class="section-title">Create a New Post</h1>
        
        {{if .ValidationErr}}
        <div class="validation-error">
          {{.ValidationErr}}
        </div>
        {{end}}
        
        <form class="create-post-form" method="POST" action="/create-post">
          <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" class="form-input" placeholder="Enter your post title" required value="{{if .FormData.title}}{{.FormData.title}}{{end}}">
          </div>
          
          <div class="form-group">
            <label>Categories:</label>
            <div class="categories-selection">
              {{range .Categories}}
              <!-- Hidden checkbox for form submission -->
              <input type="checkbox" id="category-{{.ID}}" name="categories" value="{{.ID}}" style="display: none;">
              <!-- Visible button for user interaction -->
              <button type="button" class="category-btn" data-category-id="{{.ID}}" onclick="toggleCategory(this)">{{.Name}}</button>
              {{end}}
            </div>
          </div>

          <div class="form-group">
            <label for="content">Content:</label>
            <textarea id="content" name="content" class="form-textarea" rows="10" placeholder="Write your post content here..." required>{{if .FormData.content}}{{.FormData.content}}{{end}}</textarea>
          </div>

          <div class="form-actions">
            <a href="/" class="btn">CANCEL</a>
            <button type="submit" class="btn">PUBLISH</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__content">
        <p>Powered by Zone01Athens</p>
      </div>
    </footer>
  </div>
</body>
</html>
